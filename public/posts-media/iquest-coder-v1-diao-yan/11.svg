<svg width="600" height="900" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7b4f;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7b4f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title-main { font-family: 'Microsoft YaHei', sans-serif; font-size: 36px; font-weight: bold; fill: #bfdbfe; text-anchor: middle; }
      .title-highlight { font-family: 'Microsoft YaHei', sans-serif; font-size: 44px; font-weight: bold; fill: #bfdbfe; text-anchor: middle; }
      .card-title { font-family: 'Microsoft YaHei', sans-serif; font-size: 20px; font-weight: bold; fill: #fef08a; }
      .card-body { font-family: 'Microsoft YaHei', sans-serif; font-size: 14px; fill: #e2e8f0; }
      .card-bg { fill: url(#blueGradient); stroke: url(#goldGradient); stroke-width: 1.5; rx: 10; ry: 10; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="0" y1="600" x2="600" y2="600" />
    <line x1="0" y1="700" x2="600" y2="700" />
    <line x1="0" y1="800" x2="600" y2="800" />
  </g>

  <g transform="translate(300, 80)">
    <text y="0" class="title-main">总结：IQuest-Coder</text>
    <text y="55" class="title-highlight" filter="url(#glow)">开启自主软件工程新纪元</text>
  </g>

  <g transform="translate(50, 180)">
    <rect width="500" height="130" class="card-bg" />
    
    <g transform="translate(30, 25)">
        <path d="M10 50 L40 65 L70 50 L40 35 Z" fill="#1e5bbd" opacity="0.8"/>
        <path d="M10 50 L10 80 L40 95 L40 65 Z" fill="#133d82" opacity="0.9"/>
        <path d="M40 65 L40 95 L70 80 L70 50 Z" fill="#0d2e63" opacity="0.9"/>
        <path d="M10 20 L40 35 L70 20 L40 5 Z" fill="#4aa3ff" opacity="0.3"/>
        <path d="M10 20 L10 60 L40 75 L40 35 Z" fill="#4aa3ff" opacity="0.1"/>
        <path d="M40 35 L40 75 L70 60 L70 20 Z" fill="#4aa3ff" opacity="0.1"/>
        <circle cx="28" cy="35" r="3" fill="url(#goldGradient)"/> <rect x="36" y="32" width="25" height="4" rx="2" fill="url(#goldGradient)"/>
        <circle cx="28" cy="48" r="3" fill="url(#goldGradient)"/> <rect x="36" y="45" width="25" height="4" rx="2" fill="url(#goldGradient)"/>
        <circle cx="28" cy="61" r="3" fill="url(#goldGradient)"/> <rect x="36" y="58" width="15" height="4" rx="2" fill="url(#goldGradient)"/>
    </g>

    <text x="110" y="45" class="card-title">1. 范式革新 (Paradigm Shift)</text>
    <text x="110" y="75" class="card-body">
      <tspan x="110" dy="0">提出“Code-Flow”训练范式，让模型首次具备理解</tspan>
      <tspan x="110" dy="22">代码动态演化与开发者与意图的能力。</tspan>
    </text>
  </g>

  <g transform="translate(50, 330)">
    <rect width="500" height="130" class="card-bg" />
    
    <g transform="translate(30, 25)">
        <path d="M10 50 L40 65 L70 50 L40 35 Z" fill="#1e5bbd" opacity="0.8"/>
        <path d="M10 50 L10 80 L40 95 L40 65 Z" fill="#133d82" opacity="0.9"/>
        <path d="M40 65 L40 95 L70 80 L70 50 Z" fill="#0d2e63" opacity="0.9"/>
        <path d="M10 20 L40 35 L70 20 L40 5 Z" fill="#4aa3ff" opacity="0.3"/>
        <path d="M10 20 L10 60 L40 75 L40 35 Z" fill="#4aa3ff" opacity="0.1"/>
        <path d="M40 35 L40 75 L70 60 L70 20 Z" fill="#4aa3ff" opacity="0.1"/>
        <path d="M40 35 L55 35 A 10 10 0 0 1 55 55 L 45 55" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round"/>
        <path d="M40 60 L25 60 A 10 10 0 0 1 25 40 L 35 40" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round"/>
        <polygon points="45,55 50,50 50,60" fill="url(#goldGradient)"/>
        <polygon points="35,40 30,35 30,45" fill="url(#goldGradient)"/>
        <rect x="32" y="42" width="16" height="12" rx="2" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
    </g>

    <text x="110" y="45" class="card-title">2. 架构创新 (Architectural Innovation)</text>
    <text x="110" y="75" class="card-body">
      <tspan x="110" dy="0">通过 Loop 循环架构，在顶级性能与部署效率间取得</tspan>
      <tspan x="110" dy="22">突破性平衡。</tspan>
    </text>
  </g>

  <g transform="translate(50, 480)">
    <rect width="500" height="130" class="card-bg" />
    
    <g transform="translate(30, 25)">
        <path d="M10 50 L40 65 L70 50 L40 35 Z" fill="#1e5bbd" opacity="0.8"/>
        <path d="M10 50 L10 80 L40 95 L40 65 Z" fill="#133d82" opacity="0.9"/>
        <path d="M40 65 L40 95 L70 80 L70 50 Z" fill="#0d2e63" opacity="0.9"/>
        <path d="M10 20 L40 35 L70 20 L40 5 Z" fill="#4aa3ff" opacity="0.3"/>
        <path d="M10 20 L10 60 L40 75 L40 35 Z" fill="#4aa3ff" opacity="0.1"/>
        <path d="M40 35 L40 75 L70 60 L70 20 Z" fill="#4aa3ff" opacity="0.1"/>
        <circle cx="40" cy="48" r="12" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
        <circle cx="40" cy="48" r="4" fill="url(#goldGradient)"/>
        <line x1="40" y1="36" x2="40" y2="30" stroke="url(#goldGradient)" stroke-width="2"/>
        <line x1="40" y1="60" x2="40" y2="66" stroke="url(#goldGradient)" stroke-width="2"/>
        <line x1="28" y1="48" x2="22" y2="48" stroke="url(#goldGradient)" stroke-width="2"/>
        <line x1="52" y1="48" x2="58" y2="48" stroke="url(#goldGradient)" stroke-width="2"/>
    </g>

    <text x="110" y="45" font-family="sans-serif">
      <tspan fill="url(#goldGradient)" font-size="20" font-weight="bold">3. 系统智能 (Systemic Intelligence)</tspan>
    </text>
    <text x="110" y="75" fill="#e0eaff" font-family="sans-serif" font-size="14">
      <tspan x="110" dy="0">凭借 MAC-SQL 多智能体框架，将模型能力系统</tspan>
      <tspan x="110" dy="22">化，解决了真实、复杂的行业难题。</tspan>
    </text>
  </g>

  <g transform="translate(50, 650)">
    <path d="M0,10 Q0,0 10,0 L350,0 L380,40 L500,40 Q500,40 500,50 L500,170 Q500,180 490,180 L10,180 Q0,180 0,170 Z" 
          fill="#0a254a" stroke="#1d4e8f" stroke-width="1" />
    
    <path d="M350,0 L380,40 L490,40 Q500,40 500,50 L500,70 Q450,70 420,30 Q400,0 350,0 Z" 
          fill="url(#waveGradient)" />

    <text x="20" y="35" fill="#8cbaff" font-family="sans-serif" font-size="20" font-weight="bold">未来展望</text>
    
    <text x="20" y="70" fill="#e0eaff" font-family="sans-serif" font-size="15" line-height="1.6">
      <tspan x="20" dy="0">AI for Code 正在从“辅助编程”（Copilot）快速演进至“自主软</tspan>
      <tspan x="20" dy="24">件工程”（Autonomous Software Engineering）。</tspan>
      <tspan x="20" dy="24" fill="url(#goldGradient)" font-weight="bold">IQuest-Coder-V1</tspan>
      <tspan dy="0"> 凭借其在真实工程任务中的卓越表现，证明了它不仅</tspan>
      <tspan x="20" dy="24">是这一浪潮的参与者，更是定义未来的关键力量。</tspan>
    </text>
  </g>


</svg>