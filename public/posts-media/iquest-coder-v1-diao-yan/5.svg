<svg width="800" height="1500" viewBox="0 0 800 1500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7b4f;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7b4f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title-main { font-family: 'Microsoft YaHei', sans-serif; font-size: 42px; font-weight: bold; fill: #bfdbfe; }
      .title-sub { font-family: 'Microsoft YaHei', sans-serif; font-size: 28px; font-weight: bold; fill: #e2e8f0; }
      .text-body { font-family: 'Microsoft YaHei', sans-serif; font-size: 20px; fill: #94a3b8; }
      .bar-label { font-family: 'Microsoft YaHei', sans-serif; font-size: 16px; fill: #e2e8f0; }
      .bar-value { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #94a3b8; }
      .bar-value-highlight { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #fef08a; }
      .card-bg { fill: url(#blueGradient); stroke: #334155; stroke-width: 1; rx: 15; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="0" y1="900" x2="800" y2="900" />
    <line x1="0" y1="1000" x2="800" y2="1000" />
    <line x1="0" y1="1100" x2="800" y2="1100" />
    <line x1="0" y1="1200" x2="800" y2="1200" />
    <line x1="0" y1="1300" x2="800" y2="1300" />
    <line x1="0" y1="1400" x2="800" y2="1400" />
  </g>

  <g transform="translate(50, 80)">
    <text x="0" y="0" class="title-main">全面验证 (1)：</text>
    <text x="0" y="60" class="title-main">在自主软件工程任务中取得绝对优势</text>
    
    <text x="0" y="110" class="text-body">
      <tspan x="0" dy="0">IQuest-Coder 在模拟真实开发工作流的智能体任务中，</tspan>
      <tspan x="0" dy="30">展现出前所未有的规划、执行与调试能力。</tspan>
    </text>
  </g>

  <g transform="translate(50, 260)">
    <text x="0" y="0" class="title-sub">SWE-bench Verified</text>
    <text x="0" y="30" class="text-body" font-size="18">(解决真实 GitHub 问题)</text>
    
    <line x1="0" y1="60" x2="700" y2="60" stroke="#334155" stroke-dasharray="4"/>
    <line x1="0" y1="130" x2="700" y2="130" stroke="#334155" stroke-dasharray="4"/>
    
    <rect x="0" y="70" width="570" height="40" rx="4" fill="url(#goldGradient)" filter="url(#glow)" opacity="0.6"/>
    <rect x="0" y="70" width="570" height="40" rx="4" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
    
    <text x="15" y="98" class="bar-label" font-weight="bold" fill="#fef08a">IQuest-Coder-V1-40B-Loop-Instruct</text>
    <text x="585" y="98" class="bar-value-highlight">81.4% <tspan font-size="16">(SOTA)</tspan></text>
  </g>

  <g transform="translate(50, 480)">
    <text x="0" y="0" class="title-sub">Terminal-Bench</text>
    <text x="0" y="30" class="text-body" font-size="18">(真实终端环境操作)</text>
    
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="359" height="35" rx="4" fill="url(#goldGradient)" filter="url(#glow)" opacity="0.6" />
      <rect x="0" y="0" width="359" height="35" rx="4" stroke="url(#goldGradient)" stroke-width="2" fill="none" />
      <text x="10" y="24" class="bar-label" font-weight="bold" fill="#fef08a">IQuest-Coder-V1-40B-Loop-Instruct</text>
      <text x="375" y="24" class="bar-value-highlight" font-size="20">51.3%</text>
    </g>

    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="357" height="35" rx="4" fill="url(#blueGradient)" stroke="#94a3b8" stroke-width="1" />
      <text x="10" y="24" class="bar-label">Claude 3.5 Sonnet</text>
      <text x="375" y="24" class="bar-value">51.0%</text>
    </g>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="245" height="35" rx="4" fill="url(#blueGradient)" stroke="#94a3b8" stroke-width="1" />
      <text x="10" y="24" class="bar-label">GPT-4o</text>
      <text x="260" y="24" class="bar-value">35.0%</text>
    </g>
  </g>

  <g transform="translate(50, 750)">
    <text x="0" y="0" class="title-sub">Aider-Polyglot</text>
    <text x="0" y="30" class="text-body" font-size="18">(多语言代码编辑 - Pass@2, diff)</text>

    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="643" height="35" rx="4" fill="url(#blueGradient)" stroke="#94a3b8" stroke-width="1" />
      <text x="10" y="24" class="bar-label">Gemini 3 Pro</text>
      <text x="655" y="24" class="bar-value">91.9%</text>
    </g>

    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="625" height="35" rx="4" fill="url(#blueGradient)" stroke="#94a3b8" stroke-width="1" />
      <text x="10" y="24" class="bar-label">Claude 4.5 Opus</text>
      <text x="637" y="24" class="bar-value">89.4%</text>
    </g>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="578" height="35" rx="4" fill="url(#blueGradient)" stroke="url(#goldGradient)" stroke-width="2" />
      <text x="10" y="24" class="bar-label" font-weight="bold" fill="#fef08a">IQuest-Coder-V1-40B-Instruct</text>
      <text x="590" y="24" class="bar-value-highlight" font-size="20">82.7%</text>
    </g>
  </g>

  <g transform="translate(50, 1050)">
    <rect x="-20" y="-30" width="740" height="300" class="card-bg" opacity="0.6" />
    
    <text x="0" y="20" class="title-sub" font-size="32">关键洞察</text>
    
    <text x="0" y="70" class="text-body" fill="#e2e8f0" font-size="22">
      <tspan x="0" dy="0">这些基准测试的核心是评估模型在“闭环”环境</tspan>
      <tspan x="0" dy="35">中的表现，即模型需要根据工具反馈（如编译错</tspan>
      <tspan x="0" dy="35">误、测试失败）来自我修正。</tspan>
      <tspan x="0" dy="50" fill="#fef08a" font-weight="bold">IQuest-Coder 的优异表现直接印证了</tspan>
      <tspan x="0" dy="35" fill="#fef08a" font-weight="bold">'Code-Flow' 训练范式的有效性。</tspan>
    </text>
  </g>

</svg>