<svg width="600" height="900" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7b4f;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7b4f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="0" y1="600" x2="600" y2="600" />
    <line x1="0" y1="700" x2="600" y2="700" />
    <line x1="0" y1="800" x2="600" y2="800" />
  </g>

  <g stroke="#94a3b8" stroke-width="1" opacity="0.1" fill="none">
    <path d="M0,100 H50 L80,130 H600" />
    <path d="M600,300 H500 L480,320 H0" />
    <path d="M50,800 V850 L80,880 H200" />
    <circle cx="50" cy="100" r="3" fill="#bfdbfe" />
    <circle cx="480" cy="320" r="3" fill="#bfdbfe" />
  </g>

  <g text-anchor="middle" font-family="'Microsoft YaHei', sans-serif">
    <text x="300" y="60" fill="#bfdbfe" font-size="32" font-weight="bold">核心突破：从静态快照</text>
    <text x="300" y="105" fill="url(#goldGradient)" font-size="36" font-weight="bold" filter="url(#glow)">到动态“代码流”</text>
  </g>

  <g font-family="'Microsoft YaHei', sans-serif" font-size="14" fill="#e2e8f0" text-anchor="start">
    <text x="40" y="150">传统代码模型仅学习静态的代码文件，如同分析一张张孤</text>
    <text x="40" y="172">立的照片。革命性在于 IQuest-Coder 的它学代码的演</text>
    <text x="40" y="194">化过程——即 "Code-Flow" (代码流)，如同观看一部记录</text>
    <text x="40" y="216">软件诞生的电影。</text>
  </g>

  <line x1="300" y1="260" x2="300" y2="600" stroke="#475569" stroke-width="1" />

  <g transform="translate(40, 260)">
    <text x="110" y="0" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="bold">传统范式：静态代码</text>
    
    <g transform="translate(60, 30)">
       <g fill="none" stroke="#94a3b8" stroke-width="2">
         <path d="M10,0 H50 L70,20 V80 H10 Z" />
         <path d="M50,0 V20 H70" /> <text x="40" y="50" fill="#64748b" font-size="20" stroke="none" text-anchor="middle">&lt;/&gt;</text>
       </g>
       <text x="40" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">file_v1.py</text>
       
       <g transform="translate(80, 0)" opacity="0.5">
          <path d="M10,0 H50 L70,20 V80 H10 Z" fill="none" stroke="#94a3b8" stroke-width="2"/>
          <path d="M50,0 V20 H70" fill="none" stroke="#94a3b8" stroke-width="2"/>
          <text x="40" y="100" fill="#94a3b8" font-size="12" text-anchor="middle" stroke="none">file_v2.py</text>
       </g>
    </g>

    <g transform="translate(0, 160)" font-family="'Microsoft YaHei', sans-serif">
      <text x="0" y="0" fill="#fef08a" font-size="16" font-weight="bold">学习内容</text>
      <text x="0" y="25" fill="#e2e8f0" font-size="14">• 语法结构，代码模式。</text>
      
      <text x="0" y="65" fill="#fef08a" font-size="16" font-weight="bold">局限</text>
      <text x="0" y="90" fill="#e2e8f0" font-size="14">
        <tspan x="0" dy="0">• 无法解释代码为何以及</tspan>
        <tspan x="12" dy="20">如何演变，缺乏对者</tspan>
        <tspan x="12" dy="20">“意图”的捕捉。</tspan>
      </text>
    </g>
  </g>

  <g transform="translate(320, 260)">
    <text x="130" y="0" text-anchor="middle" fill="#bfdbfe" font-size="16" font-weight="bold">IQuest-Coder 范式: Code-Flow</text>
    
    <g transform="translate(40, 30)">
       <g stroke="#94a3b8" stroke-width="2" fill="none">
         <circle cx="20" cy="20" r="5" />
         <line x1="25" y1="20" x2="65" y2="20" />
         <circle cx="70" cy="20" r="5" />
         <line x1="75" y1="20" x2="115" y2="20" />
         <circle cx="120" cy="20" r="5" />
         
         <path d="M25,20 C40,20 40,50 70,50 C100,50 100,20 115,20" stroke="url(#goldGradient)" stroke-dasharray="4,2"/>
       </g>

       <g transform="translate(0, 60)">
          <rect x="0" y="0" width="40" height="50" rx="3" fill="url(#blueGradient)" stroke="#94a3b8" stroke-width="1.5" />
          <text x="20" y="30" fill="#bfdbfe" font-size="12" text-anchor="middle">R<tspan font-size="8" dy="2">old</tspan></text>
          
          <line x1="45" y1="25" x2="95" y2="25" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)" />
          <text x="70" y="15" fill="#e2e8f0" font-size="10" text-anchor="middle">+ Patch/Commit</text>

          <rect x="100" y="0" width="40" height="50" rx="3" fill="url(#blueGradient)" stroke="url(#goldGradient)" stroke-width="2" />
          <text x="120" y="30" fill="#fef08a" font-size="12" text-anchor="middle">R<tspan font-size="8" dy="2">new</tspan></text>
       </g>
    </g>

    <g transform="translate(0, 160)" font-family="'Microsoft YaHei', sans-serif">
      <text x="0" y="0" fill="#fef08a" font-size="16" font-weight="bold">学习内容</text>
      <text x="0" y="25" fill="#e2e8f0" font-size="14">
        <tspan x="0" dy="0">• 代码的动态演化逻辑，</tspan>
        <tspan x="12" dy="20">因果关系和开发者意图。</tspan>
      </text>
      
      <text x="0" y="75" fill="#fef08a" font-size="16" font-weight="bold">优势</text>
      <text x="0" y="100" fill="#e2e8f0" font-size="14">
        <tspan x="0" dy="0">• 赋予模型真的软件工程</tspan>
        <tspan x="12" dy="20">“过程感知”力，“代码”</tspan>
        <tspan x="12" dy="20">跃升至“代码编辑与重构”</tspan>
        <tspan x="12" dy="20">新型。</tspan>
      </text>
    </g>
  </g>

  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7b4f;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7b4f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(40, 620)" font-family="'Microsoft YaHei', sans-serif">
    <text x="0" y="30" fill="#e2e8f0" font-size="16">
        <tspan x="0" dy="0">在业界公认难度最高的软件工程基准测试 SWE-bench Veri</tspan>
        <tspan x="0" dy="26">fied上, </tspan>
        <tspan fill="#fef08a" font-weight="bold">iQuest-Coder-V1 取得 81.4%</tspan>
        <tspan>, 超越了包括 Claude</tspan>
        <tspan x="0" dy="26">3.5 Sonnet 和 GPT-4o 在内的所有已知模型。</tspan>
    </text>

    <text x="0" y="130" fill="#e2e8f0" font-size="14">
        <tspan x="0" dy="0">SWE-bench 要求模型自主解决真实的 GitHub Issues, 是衡</tspan>
        <tspan x="0" dy="22">量模型在复杂、真实软件工程场景中主规则、编码调试能力的</tspan>
        <tspan x="0" dy="22">黄金标准。码大模型在解真实世界问题上实现了质的飞跃。</tspan>
    </text>

    
  </g>

</svg>