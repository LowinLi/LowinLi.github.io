<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7b4f;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7b4f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>

    <style>
      .title-main { font-family: 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: bold; fill: #bfdbfe; text-anchor: middle; }
      .title-sub { font-family: 'Microsoft YaHei', sans-serif; font-size: 32px; font-weight: bold; fill: #e2e8f0; text-anchor: middle; }
      
      .card-box { fill: url(#blueGradient); stroke: url(#goldGradient); stroke-width: 2; rx: 4; }
      
      .card-title { font-family: 'Microsoft YaHei', sans-serif; font-size: 24px; font-weight: bold; fill: #bfdbfe; alignment-baseline: hanging;}
      .card-body { font-family: 'Microsoft YaHei', sans-serif; font-size: 18px; fill: #e2e8f0; line-height: 1.6; }
      
      .highlight { font-weight: bold; fill: #fef08a; }
      .icon-fill { fill: #f0c674; }
      .connector { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowhead); opacity: 0.6; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="0" y1="900" x2="800" y2="900" />
    <line x1="0" y1="1000" x2="800" y2="1000" />
    <line x1="0" y1="1100" x2="800" y2="1100" />
  </g>

  <g transform="translate(0, 80)">
    <text x="400" y="0" class="title-main">MAC-SQL详解:</text>
    <text x="400" y="60" class="title-sub">三位一体的协作式查询生成</text>
  </g>

  <g transform="translate(50, 180)">
    <rect class="card-box" width="700" height="230" />
    
    <g transform="translate(40, 40)">
      <path class="icon-fill" d="M10,10 L90,10 L60,60 L60,130 L40,130 L40,60 Z" />
      <circle class="icon-fill" cx="30" cy="30" r="7" />
      <circle class="icon-fill" cx="70" cy="30" r="7" />
      <circle class="icon-fill" cx="50" cy="50" r="7" />
      <circle class="icon-fill" cx="50" cy="110" r="7" />
    </g>

    <g transform="translate(0, 45)">
      <text x="190" y="0" class="card-title">Stage 1: Selector (选择器)：数据库 Schema 精简</text>
      
      <text x="190" y="45" class="card-body">
        <tspan class="highlight">职责：做减法。</tspan>根据用户问题，从成百上
        <tspan x="190" dy="28">千的表中精准筛选出少数相关的表和列。</tspan>
      </text>
      
      <text x="190" y="115" class="card-body">
        <tspan class="highlight">作用：消除噪音，</tspan>将一个“大海捞针”的
        <tspan x="190" dy="28">问题，简化为在一个“小池塘”里的精确操作。</tspan>
      </text>
    </g>
  </g>

  <line x1="400" y1="410" x2="400" y2="450" class="connector" />

  <g transform="translate(50, 460)">
    <rect class="card-box" width="700" height="250" />
    
    <g transform="translate(40, 50)" class="icon-fill" stroke="#f0c674" stroke-width="4" fill="none">
      <rect x="45" y="0" width="50" height="35" rx="5" />
      <line x1="70" y1="35" x2="70" y2="60" />
      <line x1="30" y1="60" x2="110" y2="60" />
      <line x1="30" y1="60" x2="30" y2="85" />
      <line x1="110" y1="60" x2="110" y2="85" />
      <rect x="5" y="85" width="50" height="35" rx="5" />
      <rect x="85" y="85" width="50" height="35" rx="5" />
    </g>

    <g transform="translate(0, 45)">
      <text x="190" y="0" class="card-title">Stage 2: Decomposer (分解器)：复杂逻辑拆解</text>
      
      <text x="190" y="45" class="card-body">
        <tspan class="highlight">职责：做规划。</tspan>利用思维链 (Chain-of-
        <tspan x="190" dy="28">Thought)，将一个复杂的查询请求分解为一</tspan>
        <tspan x="190" dy="28">系列简单的、可执行的子问题。</tspan>
      </text>
      
      <text x="190" y="140" class="card-body">
        <tspan class="highlight">作用：降低单步推理的难度，</tspan>将复杂查询
        <tspan x="190" dy="28">转化为线性的逻辑步骤，确保推理的准确性。</tspan>
      </text>
    </g>
  </g>

  <line x1="400" y1="710" x2="400" y2="750" class="connector" />

  <g transform="translate(50, 760)">
    <rect class="card-box" width="700" height="360" />
    
    <g transform="translate(40, 90)">
       <path class="icon-fill" d="M75,10 C80,10 85,12 90,15 L100,5 C105,10 110,15 115,20 L105,30 C108,35 110,40 110,45 L125,45 C125,52 125,58 125,65 L110,65 C110,70 108,75 105,80 L115,90 C110,95 105,100 100,105 L90,95 C85,98 80,100 75,100 L75,115 C68,115 62,115 55,115 L55,100 C50,100 45,98 40,95 L30,105 C25,100 20,95 15,90 L25,80 C22,75 20,70 20,65 L5,65 C5,58 5,52 5,45 L20,45 C20,40 22,35 25,30 L15,20 C20,15 25,10 30,5 L40,15 C45,12 50,10 55,10 L55,-5 C62,-5 68,-5 75,-5 L75,10 Z M65,35 L85,55 M85,35 L65,55 M45,55 C45,66 54,75 65,75 C76,75 85,66 85,55 C85,44 76,35 65,35 C54,35 45,44 45,55 Z" />
      <g transform="translate(20, 20) rotate(-45, 65, 65)">
        <path fill="#0f172a" stroke="#f0c674" stroke-width="6" d="M50,70 C40,60 40,40 50,30 L80,60 C90,70 90,90 80,100 L50,70 Z" />
      </g>
    </g>

    <g transform="translate(0, 45)">
      <text x="190" y="0" class="card-title">Stage 3: Refiner (优化器)：执行、验证与自我修正</text>
      
      <text x="190" y="45" class="card-body">
        <tspan class="highlight">职责：做质检。</tspan>生成 SQL 后，在一个模
        <tspan x="190" dy="28">拟环境中尝试执行。</tspan>
      </text>
      
      <text x="190" y="110" class="card-body">
        <tspan class="highlight">闭环反馈：</tspan>如果执行报错或返回空结果，
        <tspan x="190" dy="28">Refiner 会分析错误信息，自动修正 SQL 查询。</tspan>
      </text>

      <text x="190" y="185" class="card-body">
        <tspan class="highlight">作用：引入了基于外部工具的反馈循环，</tspan>
        <tspan x="190" dy="28">实现了智能体的自我进化与纠错，极大提升</tspan>
        <tspan x="190" dy="28">了最终 SQL 的可用性。</tspan>
      </text>
    </g>
  </g>
  </svg>