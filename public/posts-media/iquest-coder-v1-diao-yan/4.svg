<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7b4f;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7b4f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-sans { font-family: 'Microsoft YaHei', sans-serif; }
      .title-main { font-size: 64px; font-weight: bold; fill: #bfdbfe; text-anchor: middle; }
      .text-intro { font-size: 24px; fill: #e2e8f0; text-anchor: middle; }
      .card-title { font-size: 28px; font-weight: bold; fill: #bfdbfe; }
      .label-tag { font-weight: bold; fill: #bfdbfe; }
      .body-text { font-size: 18px; fill: #e2e8f0; }
      .highlight-gold { fill: #fef08a; font-weight: bold; }
      .icon-stroke { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill-glow { fill: rgba(148, 163, 184, 0.2); stroke: #94a3b8; stroke-width: 1.5; }
      .card-bg { fill: url(#blueGradient); stroke: #94a3b8; stroke-width: 1; rx: 4; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="0" y1="900" x2="800" y2="900" />
    <line x1="0" y1="1000" x2="800" y2="1000" />
    <line x1="0" y1="1100" x2="800" y2="1100" />
  </g>

  <g class="font-sans" transform="translate(400, 60)">
    <text x="0" y="40" class="title-main">架构创新：</text>
    <text x="0" y="110" class="title-main">性能与效率的平衡之术</text>
    <text x="0" y="180" class="text-intro">
      <tspan x="0" dy="0">IQuest-Coder-V1 通过精巧架构设计，</tspan>
      <tspan x="0" dy="35">在性能与部署效率间取得卓越平衡。</tspan>
      <tspan x="0" dy="35" font-weight="bold" fill="#fef08a">模型家族：<tspan font-weight="normal" fill="#e2e8f0">覆盖从 7B 到 40B 端到云的全部需求。</tspan></tspan>
    </text>
  </g>

  <g class="font-sans" transform="translate(50, 340)">
    
    <g>
      <rect x="0" y="0" width="700" height="280" class="card-bg" />
      
      <g transform="translate(40, 40)">
        <g transform="translate(0, 10)">
           <path d="M 50 10 C 20 10, -10 40, 10 80 C 25 115, 70 120, 100 100" stroke="#f0c674" stroke-width="4" fill="none" />
           <path d="M 100 100 L 85 85 L 80 110 Z" fill="#f0c674" />
           
           <g transform="translate(70, 30)">
             <polygon points="45 0, 90 25, 45 50, 0 25" fill="rgba(148, 163, 184, 0.2)" stroke="#94a3b8" stroke-width="1.5" />
             <polygon points="45 30, 90 55, 45 80, 0 55" fill="rgba(148, 163, 184, 0.2)" stroke="#94a3b8" stroke-width="1.5" opacity="0.8"/>
             <polygon points="45 60, 90 85, 45 110, 0 85" fill="rgba(148, 163, 184, 0.2)" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
           </g>
        </g>
        
        <g transform="translate(220, 10)">
          <text x="0" y="0" class="card-title">Loop 循环架构 (Loop Architecture)</text>
          <text x="0" y="50" class="body-text">
            <tspan class="label-tag">原理：</tspan>采用递归 Transformer 设计，通过共享参数的
            <tspan x="0" dy="28">transformer块进行两次迭代计算。</tspan>
          </text>
          <text x="0" y="120" class="body-text">
            <tspan class="label-tag">优势：</tspan>提升模型计算深度与推理能力。实现了
            <tspan x="0" dy="28"><tspan class="highlight-gold">“用更少的参数，做更多的事”</tspan>，极大降低部署成本。</tspan>
          </text>
        </g>
      </g>
    </g>

    <g transform="translate(0, 300)">
       <rect x="0" y="0" width="700" height="260" class="card-bg" />
      
      <g transform="translate(40, 40)">
        <g transform="translate(10, 30)">
          <path d="M 0 25 Q 100 0, 200 25 L 200 85 Q 100 110, 0 85 Z" fill="rgba(148, 163, 184, 0.2)" stroke="#94a3b8" stroke-width="3" />
          <g stroke="#94a3b8" stroke-width="2" opacity="0.7">
            <line x1="25" y1="45" x2="70" y2="45" /> <line x1="80" y1="45" x2="110" y2="45" stroke="#f0c674"/>
            <line x1="30" y1="58" x2="160" y2="58" />
            <line x1="25" y1="71" x2="60" y2="71" /> <line x1="70" y1="71" x2="140" y2="71" />
            <line x1="35" y1="84" x2="100" y2="84" />
          </g>
        </g>
        
        <g transform="translate(240, 20)">
          <text x="0" y="0" class="card-title">128K 原生长上下文 (Native Context)</text>
          <text x="0" y="50" class="body-text">
            <tspan class="label-tag">能力：</tspan>一次性处理数十万 token，轻松覆盖整个代码
            <tspan x="0" dy="28">仓库，为仓库级代码理解与重构任务提供可能。</tspan>
          </text>
        </g>
      </g>
    </g>

    <g transform="translate(0, 580)">
       <rect x="0" y="0" width="700" height="260" class="card-bg" />
      
      <g transform="translate(40, 40)">
        <g transform="translate(20, 20)">
          <g class="icon-fill-glow">
            <rect x="0" y="0" width="60" height="30" rx="6"/>
            <text x="30" y="20" fill="#e2e8f0" font-size="12" text-anchor="middle" stroke="none">Query</text>
            
            <rect x="0" y="45" width="60" height="30" rx="6"/>
            <text x="30" y="65" fill="#e2e8f0" font-size="12" text-anchor="middle" stroke="none">Query</text>
            
            <rect x="0" y="90" width="60" height="30" rx="6"/>
            <text x="30" y="110" fill="#e2e8f0" font-size="12" text-anchor="middle" stroke="none">Query</text>
          </g>

          <rect x="120" y="30" width="80" height="60" rx="8" fill="rgba(148, 163, 184, 0.4)" stroke="#94a3b8" stroke-width="2" />
          <text x="160" y="60" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="bold" stroke="none">KV Head</text>

          <g stroke="#94a3b8" stroke-width="2" fill="none">
            <path d="M 65 15 C 90 15, 90 45, 115 50" marker-end="url(#arrowheadBlue)"/>
            <line x1="65" y1="60" x2="115" y2="60" marker-end="url(#arrowheadBlue)"/>
            <path d="M 65 105 C 90 105, 90 75, 115 70" marker-end="url(#arrowheadBlue)"/>
          </g>
        </g>
        
        <g transform="translate(240, 30)">
          <text x="0" y="0" class="card-title">分组查询注意力 (GQA)</text>
          <text x="0" y="50" class="body-text">
            <tspan class="label-tag">技术：</tspan>采用 Grouped Query Attention 机制。
          </text>
          <text x="0" y="100" class="body-text">
            <tspan class="label-tag">优势：</tspan>大幅降低长上下文推理中的 KV Cache 显存
            <tspan x="0" dy="28">占用，是实现 <tspan class="highlight-gold">128K 上下文</tspan> 的关键技术。</tspan>
          </text>
        </g>
      </g>
    </g>

  </g>
  
  <defs>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>
</svg>