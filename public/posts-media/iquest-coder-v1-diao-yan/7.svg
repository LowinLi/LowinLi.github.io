<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7b4f;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7b4f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title-text { font-family: 'Microsoft YaHei', sans-serif; font-weight: bold; fill: #bfdbfe; text-anchor: middle; }
      .label-gold { font-family: 'Microsoft YaHei', sans-serif; font-weight: bold; fill: #fef08a; }
      .text-body { font-family: 'Microsoft YaHei', sans-serif; fill: #e2e8f0; }
      .text-body-dim { font-family: 'Microsoft YaHei', sans-serif; fill: #94a3b8; }
      .glow-path { fill: none; stroke: #f0c674; stroke-width: 2; stroke-linecap: round; }
      .icon-stroke { fill: none; stroke: #f0c674; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="0" y1="900" x2="800" y2="900" />
    <line x1="0" y1="1000" x2="800" y2="1000" />
    <line x1="0" y1="1100" x2="800" y2="1100" />
  </g>
  
  <path d="M50 130 L750 130" stroke="#f0c040" stroke-width="1" opacity="0.3" />

  <g transform="translate(400, 80)">
    <text y="0" text-anchor="middle" class="title-text" font-size="52">超越模型：构建系统级</text>
    <text y="70" text-anchor="middle" class="title-text" font-size="52">智能体框架 MAC-SQL</text>
  </g>

  <g transform="translate(60, 220)">
    <text x="0" y="0" class="label-gold" font-size="24">核心问题：<tspan fill="#e2e8f0" font-weight="normal">在企业级 Text-to-SQL 任务中，单一的大模型面临</tspan></text>
    <text x="0" y="36" class="label-gold" font-size="24">三大挑战：</text>
    
    <g transform="translate(0, 80)">
      <text x="0" y="0" class="label-gold" font-size="24">1. Schema 噪音：</text>
      <text x="210" y="0" class="text-body" font-size="24">数据库结构庞大复杂，难以处理。</text>
      
      <text x="0" y="45" class="label-gold" font-size="24">2. 逻辑复杂：</text>
      <text x="170" y="45" class="text-body" font-size="24">用户问题往往需要多步推理和复杂关联。</text>
      
      <text x="0" y="90" class="label-gold" font-size="24">3. 幻觉风险：</text>
      <text x="170" y="90" class="text-body" font-size="24">模型容易生成错误的列名或不存在的表关联。</text>
    </g>
  </g>

  <g transform="translate(60, 460)">
    <text x="0" y="0" class="label-gold" font-size="26">IQuest 的解决方案：架构重于模型。</text>
    <text x="0" y="40" class="text-body" font-size="24">设计一个多智能体协作 (Multi-Agent Collaborative) 框架，将</text>
    <text x="0" y="80" class="text-body" font-size="24">复杂问题解耦。</text>
  </g>

  <g transform="translate(0, 560)">
    
    <g transform="translate(160, 150)">
      <circle r="60" fill="#f0c674" opacity="0.1" />
      
      <g stroke="#f0c674" fill="none" stroke-width="1.5" opacity="0.8">
        <ellipse rx="50" ry="30" transform="rotate(0)" />
        <ellipse rx="50" ry="35" transform="rotate(45)" />
        <ellipse rx="45" ry="40" transform="rotate(90)" />
        <ellipse rx="50" ry="25" transform="rotate(135)" />
        <ellipse rx="48" ry="32" transform="rotate(20)" />
        <ellipse rx="52" ry="28" transform="rotate(160)" />
      </g>
      <text y="100" text-anchor="middle" class="text-body" font-size="22">复杂用户查询</text>
    </g>

    <g transform="translate(280, 150)">
      <path d="M0,-15 L80,-15 L80,-35 L140,0 L80,35 L80,15 L0,15 Z" fill="#f0c674" opacity="0.6" />
    </g>

    <g transform="translate(480, 50)">
      
      <g transform="translate(0, 0)">
        <path d="M-60,100 C-20,100 0,20 100,20" class="glow-path" stroke="#94a3b8" opacity="0.5" />
        <g transform="translate(140, 0)">
          <path class="icon-stroke" d="M0,10 C0,5 25,5 25,10 C25,15 0,15 0,10 Z M0,10 L0,35 C0,40 25,40 25,35 L25,10 M0,22 C0,27 25,27 25,22" />
          <circle cx="20" cy="30" r="8" fill="#0f172a" stroke="#f0c674" stroke-width="2" />
          <path d="M16,30 L24,30 M20,26 L20,34" stroke="#f0c674" stroke-width="2" />
          <text x="-20" y="70" class="text-body" font-size="22">Schema Agent</text>
        </g>
      </g>

      <g transform="translate(0, 100)">
        <path d="M-60,0 C-30,0 -10,0 80,0" class="glow-path" stroke="#94a3b8" opacity="0.5" />
        <g transform="translate(140, -25)">
          <rect x="0" y="0" width="15" height="15" rx="3" class="icon-stroke" />
          <rect x="30" y="0" width="15" height="15" rx="3" class="icon-stroke" />
          <rect x="15" y="30" width="15" height="15" rx="3" class="icon-stroke" />
          <path d="M15,7.5 L30,7.5 M7.5,15 L7.5,37 L15,37 M37.5,15 L37.5,37 L30,37" class="icon-stroke" stroke-width="1.5" />
          <text x="-15" y="80" class="text-body" font-size="22">Logic Agent</text>
        </g>
      </g>

      <g transform="translate(0, 200)">
        <path d="M-60,-100 C-20,-100 0,-20 100,-20" class="glow-path" stroke="#94a3b8" opacity="0.5" />
        <g transform="translate(140, -40)">
          <circle cx="20" cy="20" r="12" class="icon-stroke" />
          <line x1="29" y1="29" x2="40" y2="40" class="icon-stroke" stroke-width="3" />
          <path d="M15,20 L20,20 L20,15" stroke="#f0c674" stroke-width="2" fill="none" opacity="0.7"/>
          <text x="-25" y="70" class="text-body" font-size="22">Execution Agent</text>
        </g>
      </g>
    </g>

    <text x="400" y="380" text-anchor="middle" class="label-gold" font-size="22" opacity="0.9">解耦与组织: MAC-SQL 框架</text>
  </g>

  <g transform="translate(60, 1060)">
    <path d="M0,-20 L0,80" stroke="#f0c674" stroke-width="2" opacity="0.5" />
    <text x="20" y="0" class="text-body" font-size="22">MAC-SQL 框架展示了 IQuest Lab 将底层模型能力封装为高效、可靠</text>
    <text x="20" y="36" class="text-body" font-size="22">的上层应用系统的工程思想。</text>
  </g>

</svg>