<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7b4f;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7b4f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title-main { font-family: 'Microsoft YaHei', sans-serif; font-size: 48px; font-weight: bold; fill: #bfdbfe; text-anchor: middle; }
      .title-sub { font-family: 'Microsoft YaHei', sans-serif; font-size: 20px; fill: #e2e8f0; text-anchor: middle; }
      .card-title { font-family: 'Microsoft YaHei', sans-serif; font-size: 24px; font-weight: bold; fill: #fef08a; }
      .card-body { font-family: 'Microsoft YaHei', sans-serif; font-size: 18px; fill: #bfdbfe; }
      .label-gold { font-family: 'Microsoft YaHei', sans-serif; font-size: 18px; font-weight: bold; fill: #fef08a; }
      .card-bg { fill: url(#blueGradient); stroke: url(#goldGradient); stroke-width: 2; rx: 20; ry: 20; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="0" y1="900" x2="800" y2="900" />
    <line x1="0" y1="1000" x2="800" y2="1000" />
    <line x1="0" y1="1100" x2="800" y2="1100" />
  </g>

  <text x="400" y="80" class="title-main">十年积淀：从物理世界的流，</text>
  <text x="400" y="140" class="title-main">到数字世界的流</text>
  <text x="400" y="200" class="title-sub">
    <tspan x="400" dy="0">IQuest-Coder 的成功并非偶然，而是 IQuest Lab 十余年在复杂</tspan>
    <tspan x="400" dy="30">动态系统建模领域深厚积累的必然结果。</tspan>
  </text>

  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="700" height="280" class="card-bg" />
    <text x="30" y="45" class="card-title">过去 (2015-2021)：时空数据挖掘 (Spatio-Temporal Data)</text>
    <image x="30" y="70" width="250" height="150" xlink:href="image_1.png" clip-path="inset(0 50% 50% 0)" preserveAspectRatio="xMidYMid slice"/>
    <text x="300" y="100" class="card-body">• 研究对象: 城市交通流、人流预测。</text>
    <text x="300" y="140" class="card-body">• 代表作: TrafficGAN, ST-ResNet。</text>
    <text x="30" y="235" class="label-gold">核心能力:</text>
    <text x="120" y="235" class="card-body">捕捉图网络 (路网) 上的序列 (时间) 演化规律。</text>
    <text x="120" y="265" class="card-body">对生成式模型 (GAN) 有深刻理解。</text>
  </g>

  <g transform="translate(0, 540)" filter="url(#glow)">
    <path d="M 200 0 C 300 100, 500 100, 600 0" stroke="#f0c674" stroke-width="3" fill="none"/>
    <path d="M 180 20 C 280 120, 520 120, 620 20" stroke="#475569" stroke-width="3" fill="none"/>
    <path d="M 220 -20 C 320 80, 480 80, 580 -20" stroke="#f0c674" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 160 40 C 260 140, 540 140, 640 40" stroke="#475569" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <g transform="translate(50, 680)">
    <rect x="0" y="0" width="700" height="280" class="card-bg" />
    <text x="30" y="45" class="card-title">现在 (2022-至今)：代码智能 (Code Intelligence)</text>
    <image x="30" y="70" width="250" height="150" xlink:href="image_1.png" clip-path="inset(0 0 50% 50%)" preserveAspectRatio="xMidYMid slice"/>
    <text x="300" y="100" class="card-body">• 研究对象: 软件代码流、仓库演化。</text>
    <text x="300" y="140" class="card-body">• 代表作: IQuest-Coder (Code-Flow)。</text>
    <text x="30" y="235" class="label-gold">能力迁移:</text>
    <text x="120" y="235" class="card-body">将处理图结构 (AST) 和序列 (逻辑) 的经验完美迁移。</text>
    <text x="120" y="265" class="card-body">对生成式模型 (Transformer) 的掌控力一脉相承。</text>
  </g>

  <text x="50" y="1020" class="label-gold">叙事升华:</text>
  <text x="150" y="1020" class="card-body">
    <tspan x="150" dy="0">IQuest Lab 拥有对“流”的深刻洞察——无论是车流、人流，还</tspan>
    <tspan x="50" dy="30">是驱动软件进化的代码流。这种跨领域的知识迁移，构成了其独特的技术</tspan>
    <tspan x="50" dy="30">护城河。</tspan>
  </text>
</svg>