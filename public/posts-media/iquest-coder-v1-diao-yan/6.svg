<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7b4f;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7b4f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <style>
      .main-title { font-family: 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: bold; fill: #bfdbfe; text-anchor: middle; }
      .sub-title { font-family: 'Microsoft YaHei', sans-serif; font-size: 36px; font-weight: bold; fill: #fef08a; text-anchor: middle; }
      .intro-text { font-family: 'Microsoft YaHei', sans-serif; font-size: 18px; fill: #e2e8f0; text-anchor: middle; }
      .card-bg { fill: url(#blueGradient); stroke: #94a3b8; stroke-width: 1; rx: 4; }
      .card-title { font-family: 'Microsoft YaHei', sans-serif; font-size: 20px; font-weight: bold; fill: #bfdbfe; }
      .card-subtitle { font-family: 'Microsoft YaHei', sans-serif; font-size: 14px; fill: #94a3b8; }
      .bar-bg { fill: #1e293b; rx: 4; }
      .bar-fill { fill: url(#goldGradient); rx: 4; }
      .bar-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; }
      .body-text { font-family: 'Microsoft YaHei', sans-serif; font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="0" y1="900" x2="800" y2="900" />
    <line x1="0" y1="1000" x2="800" y2="1000" />
    <line x1="0" y1="1100" x2="800" y2="1100" />
  </g>

  <g text-anchor="middle">
    <text x="400" y="80" class="main-title">全面验证 (2)</text>
    <text x="400" y="140" class="sub-title">顶级的算法竞赛与代码推理能力</text>
    
    <text x="400" y="190" class="intro-text">
      <tspan x="400" dy="0">除了工程实践，IQuest-Coder 在需要深度逻辑思考的</tspan>
      <tspan x="400" dy="25">算法编程与代码推理任务中同样表现卓越。</tspan>
    </text>
  </g>

  <g transform="translate(40, 260)">
    <rect width="340" height="260" class="card-bg" />
    
    <text x="20" y="40" class="card-title">LiveCodeBench v6</text>
    <text x="20" y="65" class="card-subtitle">(前沿竞赛编程)</text>

    <rect x="20" y="100" width="300" height="30" class="bar-bg" />
    <rect x="20" y="100" width="243" height="30" class="bar-fill" />
    <text x="30" y="122" class="bar-text" fill="#000000">81.1% (SOTA)</text>
    
    <text x="20" y="90" class="card-subtitle">IQuest-Coder-V1-40B</text>
    
    <text x="20" y="160" class="body-text">
      <tspan x="20" dy="0">该基准测试持续更新，有效防止</tspan>
      <tspan x="20" dy="18">数据污染，真实反映模型泛化能力。</tspan>
    </text>
  </g>

  <g transform="translate(420, 260)">
    <rect width="340" height="260" class="card-bg" />
    
    <text x="20" y="40" class="card-title">CruxEval</text>
    <text x="20" y="65" class="card-subtitle">(代码推理与执行)</text>

    <rect x="20" y="100" width="300" height="30" class="bar-bg" />
    <rect x="20" y="100" width="293" height="30" class="bar-fill" />
    <text x="180" y="122" class="bar-text" fill="#000000">97.9% (Input-CoT)</text>
    
    <text x="20" y="90" class="card-subtitle">IQuest-Coder-Thinking</text>

    <text x="20" y="160" class="body-text">
      <tspan x="20" dy="0">在预测代码输出(正向推理)和根据</tspan>
      <tspan x="20" dy="18">输出反推输入(逆向推理)任务上</tspan>
      <tspan x="20" dy="18">均表现出色。</tspan>
    </text>
  </g>

  <g transform="translate(40, 560)">
    <rect width="340" height="260" class="card-bg" />
    
    <text x="20" y="40" class="card-title">BigCodeBench</text>
    <text x="20" y="65" class="card-subtitle">(复杂库调用)</text>

    <text x="20" y="95" class="card-subtitle">IQuest-Coder-V1-40B</text>
    <rect x="20" y="100" width="150" height="25" class="bar-fill" />
    <text x="30" y="118" class="bar-text" fill="#000000">49.9%</text>

    <text x="20" y="145" class="card-subtitle" opacity="0.6">Kimi-K2</text>
    <rect x="20" y="150" width="145" height="20" class="bar-fill"/>
    <text x="30" y="165" class="bar-text" fill="#000000">49.8%</text>

    <text x="20" y="190" class="card-subtitle" opacity="0.6">Qwen3-Coder</text>
    <rect x="20" y="195" width="140" height="20" class="bar-fill"/>
    <text x="30" y="212" class="bar-text" fill="#000000">49.4%</text>
  </g>

  <g transform="translate(420, 560)">
    <rect width="340" height="260" class="card-bg" />
    
    <text x="20" y="40" class="card-title">代码生成 (EvalPlus)</text>
    <text x="20" y="65" class="card-subtitle">HumanEval+ &amp; MBPP+</text>

    <rect x="20" y="100" width="300" height="30" class="bar-bg" />
    <rect x="20" y="100" width="270" height="30" class="bar-fill" />
    <text x="30" y="120" class="bar-text" fill="#000000" font-size="13">HumanEval+ : 90.2%</text>

    <rect x="20" y="150" width="300" height="30" fill="#1e3a5f" rx="4"/>
    <rect x="20" y="150" width="214" height="30" fill="url(#goldGradient)" rx="4"/> <text x="30" y="170" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold">MBPP+ : 71.4%</text>
    
    <text x="20" y="220" fill="#a0c0e0" font-family="sans-serif" font-size="12">IQuest-Coder-V1-40B-Instruct</text>
  </g>

  <g transform="translate(40, 850)">
    <rect width="720" height="200" rx="20" ry="20" fill="#0f2942" stroke="#f2c94c" stroke-width="2"/>
    <rect width="720" height="200" rx="20" ry="20" fill="url(#cardGradient)" opacity="0.5"/>

    <text x="40" y="50" fill="#f2c94c" font-family="sans-serif" font-size="28" font-weight="bold">关键洞察</text>

    <text x="40" y="90" fill="#ffffff" font-family="sans-serif" font-size="20" line-spacing="1.5">
      <tspan x="40" dy="0">“思考”（Thinking）模型在 LiveCodeBench 和 CruxEval 上的优异</tspan>
      <tspan x="40" dy="35">表现，证明了其基于强化学习的后训练路径成功激发了模型</tspan>
      <tspan x="40" dy="35">更深层次的逻辑推理能力。</tspan>
    </text>
    
    </g>
  
  <path d="M0 1180 L800 1180" stroke="#2d6da6" stroke-width="1" opacity="0.5"/>
</svg>